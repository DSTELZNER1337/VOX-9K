<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VOX-9K</title>

    <style>
        body {
            background-color: #121212;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.65),
                    rgba(0, 0, 0, 0.65)
                ),
                url("/background-image");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            min-height: calc(100vh - 60px);
            position: relative;
            box-sizing: border-box;
            padding-bottom: 28px;

            color: #e8e8e8;
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        textarea, .read-view {
            width: 100%;
            max-width: 900px;
            min-height: 400px;

            background-color: rgba(30, 30, 30, 0.92);
            color: #e8e8e8;

            border: 1px solid #444;
            border-radius: 6px;

            padding: 12px;

            font-size: 16px;
            line-height: 1.5;

            resize: vertical;
            color: #bdc2c9;
            font-family: monospace;
        }

        button {
            background-color: #2b2b2b;
            color: #e8e8e8;

            border: 1px solid #555;
            border-radius: 5px;

            padding: 8px 16px;

            cursor: pointer;
            margin-right: 5px;
        }

        button:hover {
            background-color: #3a3a3a;
        }

        select,
        input[type="text"] {
            background-color: #2b2b2b;
            color: #e8e8e8;

            border: 1px solid #555;
            border-radius: 5px;

            padding: 6px 10px;
            min-width: 240px;
        }

        input[type="text"] {
            width: 460px;
            max-width: calc(100vw - 180px);
        }

        .hidden {
            display: none;
        }

        .controls {
            margin-top: 20px;
        }

        .control-row {
            margin-top: 15px;
        }

        .control-row label {
            display: inline-block;
            width: 70px;
        }

        input[type="range"] {
            width: 250px;
            vertical-align: middle;
        }

        .value-display {
            display: inline-block;
            width: 60px;
            margin-left: 10px;
        }

        .compute-info {
            margin-left: 10px;
            color: #aaaaaa;
            font-size: 13px;
        }

        select option:disabled {
            color: #777777;
        }

        #status {
            margin-top: 20px;
            color: #aaaaaa;
        }
        [hidden] { display: none !important; }
        .read-view {
            display: inline-block;
            position: relative;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            overflow: auto;
        }
        .read-view .read-through { color: #ffffff; }
        .brand-footer {
            position: absolute;
            right: 0;
            bottom: 3px;
            color: rgba(255, 255, 255, 0.28);
            font-size: 11px;
            line-height: 16px;
            pointer-events: none;
            user-select: none;
        }
        #backgroundStatus:empty { display: none; }
        .header-tools { position: absolute; top: 0; right: 0; display: flex; gap: 4px; align-items: center; }
        .header-tools button { padding: 5px 8px; margin: 0; font-size: 11px; color: #b8b8b8; }
        #backgroundButton { width: 32px; height: 29px; }
        #backgroundButton svg { display: block; width: 16px; height: 16px; }
        h1 { padding-right: 180px; }
        .export-info { margin-top: 8px; font-size: 12px; color: #aaaaaa; max-width: 920px; line-height: 1.5; }
        .export-info a { color: #d2d6df; margin-right: 8px; }
        button:disabled { opacity: .5; cursor: default; }
        button:focus-visible, a:focus-visible { outline: 2px solid #b9b6e8; outline-offset: 3px; }
    </style>
</head>

<body>

    <h1>VOX-9K</h1>
    <div class="header-tools">
        <button id="backgroundButton" title="Change Background" aria-label="Change Background">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 4 4 3-3 5 5"/></svg>
        </button>
        <button id="restoreBackground" title="Restore Default Background">Restore default</button>
        <input type="file" id="backgroundFile" accept="image/png,image/jpeg,image/webp" hidden>
    </div>
    <div id="backgroundStatus" class="export-info" role="status"></div>

    <textarea
        id="promptText"
        placeholder="Paste a ChatGPT or Codex prompt here..."
    ></textarea>
    <div id="readView" class="read-view" role="region" tabindex="0" hidden
         aria-label="Reading progress: the current and completed speech chunks are highlighted"
         aria-describedby="status"><span id="readCompleted" class="read-through"></span><span id="readCurrent" class="read-through"></span><span id="readRemaining"></span></div>

    <div class="controls">

        <button id="readButton">Read</button>
        <button id="pauseButton">Pause</button>
        <button id="stopButton">Stop</button>
        <button id="exportButton">Download WAV</button>
        <button id="cancelExport" hidden>Cancel export</button>
        <div class="export-info">
            <div id="exportEstimate"></div>
            <div id="exportStatus" role="status" aria-live="polite"></div>
            <a id="exportDownload" href="#" download="VOX-9K-Recording.wav" hidden>Save WAV</a>
        </div>

        <div class="control-row">
            <label for="engineSelect">
                Engine:
            </label>

            <select id="engineSelect">
                <option value="kokoro" selected>
                    Kokoro
                </option>

                <option value="qwen">
                    Qwen3-TTS 0.6B
                </option>
            </select>

            <span
                id="engineInfo"
                class="compute-info"
            >
                Fast / lightweight
            </span>
        </div>

        <div class="control-row">
            <label for="voiceSelect">
                Voice:
            </label>

            <select id="voiceSelect">
                <optgroup label="American Female">
                    <option value="af_sarah" selected>Sarah</option>
                    <option value="af_heart">Heart</option>
                    <option value="af_bella">Bella</option>
                    <option value="af_nicole">Nicole</option>
                    <option value="af_nova">Nova</option>
                    <option value="af_sky">Sky</option>
                </optgroup>

                <optgroup label="American Male">
                    <option value="am_michael">Michael</option>
                    <option value="am_fenrir">Fenrir</option>
                    <option value="am_puck">Puck</option>
                    <option value="am_onyx">Onyx</option>
                    <option value="am_liam">Liam</option>
                </optgroup>

                <optgroup label="British Female">
                    <option value="bf_emma">Emma</option>
                    <option value="bf_isabella">Isabella</option>
                    <option value="bf_lily">Lily</option>
                </optgroup>

                <optgroup label="British Male">
                    <option value="bm_george">George</option>
                    <option value="bm_fable">Fable</option>
                    <option value="bm_lewis">Lewis</option>
                    <option value="bm_daniel">Daniel</option>
                </optgroup>
            </select>
        </div>

        <div class="control-row">
            <label for="computeSelect">
                Compute:
            </label>

            <select id="computeSelect">
                <option value="auto" selected>
                    Auto
                </option>

                <option value="cpu">
                    CPU
                </option>

                <option
                    id="cudaOption"
                    value="cuda"
                >
                    NVIDIA GPU
                </option>
            </select>

            <span
                id="computeInfo"
                class="compute-info"
            >
                Checking hardware...
            </span>
        </div>

        <div class="control-row">
            <label for="speedSlider">
                Speed:
            </label>

            <input
                type="range"
                id="speedSlider"
                min="0.5"
                max="2"
                step="0.1"
                value="1"
            >

            <span
                id="speedValue"
                class="value-display"
            >
                1.0x
            </span>
        </div>

        <div class="control-row">
            <label for="volumeSlider">
                Volume:
            </label>

            <input
                type="range"
                id="volumeSlider"
                min="0"
                max="1"
                step="0.1"
                value="1"
            >

            <span
                id="volumeValue"
                class="value-display"
            >
                100%
            </span>
        </div>

    </div>

    <div id="status">
        Ready
    </div>

    <footer class="brand-footer">Created by: Stelz Tools</footer>

    <script src="/vox_helpers.js"></script>
    <script>

        // ==================================================
        // HTML ELEMENTS
        // ==================================================

        const readButton =
            document.getElementById("readButton");

        const pauseButton =
            document.getElementById("pauseButton");

        const stopButton =
            document.getElementById("stopButton");

        const promptText =
            document.getElementById("promptText");

        const engineSelect =
            document.getElementById("engineSelect");

        const engineInfo =
            document.getElementById("engineInfo");

        const voiceSelect =
            document.getElementById("voiceSelect");

        const computeSelect =
            document.getElementById("computeSelect");

        const cudaOption =
            document.getElementById("cudaOption");

        const computeInfo =
            document.getElementById("computeInfo");

        const speedSlider =
            document.getElementById("speedSlider");

        const speedValue =
            document.getElementById("speedValue");

        const volumeSlider =
            document.getElementById("volumeSlider");

        const volumeValue =
            document.getElementById("volumeValue");

        const statusDisplay =
            document.getElementById("status");


        // ==================================================
        // PLAYBACK STATE
        // ==================================================

        let speechChunks = [];

        let currentChunk = 0;

        let currentAudio = null;

        let currentAudioUrl = null;

        let isPaused = false;

        let isActive = false;

        let playbackSession = 0;

        // The voice selected when Read is pressed.
        // Locking it for the session keeps prefetched chunks
        // from accidentally using a different voice.
        let activeEngine = "kokoro";

        let activeEngineLabel = "Kokoro";

        let activeVoice = "af_sarah";

        let activeVoiceLabel = "Sarah";

        let activeCompute = "auto";

        let systemInfo = null;

        const chunkAudioCache = new Map();

        const fetchControllers = new Map();

        // Qwen fast streaming playback state.
        let qwenAudioContext = null;
        let qwenGainNode = null;
        let qwenCurrentSource = null;
        let qwenScheduledSources = [];
        let qwenNextStartTime = 0;
        let qwenAudioQueue = [];
        let qwenGenerationComplete = false;
        let qwenReadStartedAt = 0;
        let qwenFirstAudioStarted = false;

        const qwenStreamChunkSize = 8;
        const qwenClientId = crypto.randomUUID();
        let activeQwenRequestId = null;


        // ==================================================
        // ENGINE / VOICE OPTIONS
        // ==================================================

        const kokoroVoiceGroups = [
            {
                label: "American Female",
                voices: [
                    ["af_sarah", "Sarah"],
                    ["af_heart", "Heart"],
                    ["af_bella", "Bella"],
                    ["af_nicole", "Nicole"],
                    ["af_nova", "Nova"],
                    ["af_sky", "Sky"]
                ]
            },
            {
                label: "American Male",
                voices: [
                    ["am_michael", "Michael"],
                    ["am_fenrir", "Fenrir"],
                    ["am_puck", "Puck"],
                    ["am_onyx", "Onyx"],
                    ["am_liam", "Liam"]
                ]
            },
            {
                label: "British Female",
                voices: [
                    ["bf_emma", "Emma"],
                    ["bf_isabella", "Isabella"],
                    ["bf_lily", "Lily"]
                ]
            },
            {
                label: "British Male",
                voices: [
                    ["bm_george", "George"],
                    ["bm_fable", "Fable"],
                    ["bm_lewis", "Lewis"],
                    ["bm_daniel", "Daniel"]
                ]
            }
        ];


        const qwenVoiceGroups = [
            {
                label: "English Native",
                voices: [
                    [
                        "Ryan",
                        "Ryan - Dynamic Male (English)"
                    ],
                    [
                        "Aiden",
                        "Aiden - Sunny Male (English)"
                    ]
                ]
            },
            {
                label: "Chinese Native",
                voices: [
                    [
                        "Vivian",
                        "Vivian - Bright Female (Chinese)"
                    ],
                    [
                        "Serena",
                        "Serena - Warm Female (Chinese)"
                    ],
                    [
                        "Uncle_Fu",
                        "Uncle Fu - Mellow Male (Chinese)"
                    ],
                    [
                        "Dylan",
                        "Dylan - Youthful Male (Chinese)"
                    ],
                    [
                        "Eric",
                        "Eric - Lively Male (Chinese)"
                    ]
                ]
            },
            {
                label: "Japanese Native",
                voices: [
                    [
                        "Ono_Anna",
                        "Ono Anna - Playful Female (Japanese)"
                    ]
                ]
            },
            {
                label: "Korean Native",
                voices: [
                    [
                        "Sohee",
                        "Sohee - Warm Female (Korean)"
                    ]
                ]
            }
        ];


        function populateVoiceOptions() {

            const engine =
                engineSelect.value;


            const groups =
                engine === "qwen"
                    ? qwenVoiceGroups
                    : kokoroVoiceGroups;


            voiceSelect.innerHTML = "";


            for (const group of groups) {

                const optgroup =
                    document.createElement(
                        "optgroup"
                    );


                optgroup.label =
                    group.label;


                for (
                    const [
                        value,
                        label
                    ]
                    of group.voices
                ) {

                    const option =
                        document.createElement(
                            "option"
                        );


                    option.value =
                        value;


                    option.textContent =
                        label;


                    optgroup.appendChild(
                        option
                    );
                }


                voiceSelect.appendChild(
                    optgroup
                );
            }


            if (engine === "qwen") {

                voiceSelect.value =
                    "Ryan";

            } else {

                voiceSelect.value =
                    "af_sarah";
            }
        }


        function selectedEngineInfo() {

            if (
                !systemInfo ||
                !systemInfo.engines
            ) {

                return null;
            }


            return (
                systemInfo.engines[
                    engineSelect.value
                ]
                || null
            );
        }


        function resolvedComputeLabel(
            mode,
            engine = engineSelect.value
        ) {

            let engineInfo = null;


            if (
                systemInfo &&
                systemInfo.engines
            ) {

                engineInfo =
                    systemInfo.engines[
                        engine
                    ]
                    || null;
            }


            if (mode === "auto") {

                const preference =
                    engineInfo
                        ? engineInfo.auto_preference
                        : "unknown";


                if (
                    preference === "cuda"
                ) {

                    return "NVIDIA GPU";
                }


                if (
                    preference === "cpu"
                ) {

                    return "CPU";
                }


                return "Unknown";
            }


            if (mode === "cuda") {

                return "NVIDIA GPU";
            }


            if (mode === "cpu") {

                return "CPU";
            }


            return "Unknown";
        }


        function updateEngineUI() {

            const engine =
                engineSelect.value;


            populateVoiceOptions();


            if (engine === "qwen") {

                const info =
                    selectedEngineInfo();

                const suffix =
                    info &&
                    info.status &&
                    info.status !== "ready"
                        ? " / " + info.status
                        : "";

                engineInfo.textContent =
                    "Natural / streaming" +
                    suffix;

            } else {

                engineInfo.textContent =
                    "Fast / lightweight";
            }


            updateComputeAvailability();
        }


        function updateComputeAvailability() {

            const info =
                selectedEngineInfo();


            const modes =
                info && info.modes
                    ? info.modes
                    : null;


            const cpuAvailable =
                modes
                    ? Boolean(
                        modes.cpu
                    )
                    : true;


            const cudaAvailable =
                modes
                    ? Boolean(
                        modes.cuda
                    )
                    : false;


            const autoAvailable =
                modes
                    ? Boolean(
                        modes.auto
                    )
                    : true;


            const autoOption =
                computeSelect.querySelector(
                    'option[value="auto"]'
                );


            const cpuOption =
                computeSelect.querySelector(
                    'option[value="cpu"]'
                );


            if (autoOption) {

                autoOption.disabled =
                    !autoAvailable;
            }


            if (cpuOption) {

                cpuOption.disabled =
                    !cpuAvailable;
            }


            cudaOption.disabled =
                !cudaAvailable;


            cudaOption.textContent =
                cudaAvailable
                    ? "NVIDIA GPU"
                    : "NVIDIA GPU (Unavailable)";


            if (
                computeSelect.selectedOptions[
                    0
                ] &&
                computeSelect.selectedOptions[
                    0
                ].disabled
            ) {

                if (autoAvailable) {

                    computeSelect.value =
                        "auto";

                } else if (cpuAvailable) {

                    computeSelect.value =
                        "cpu";
                }
            }


            updateComputeDisplay();
        }


        // ==================================================
        // CLEAN TEXT
        // ==================================================

        // Share the existing cleanup rules with an optional original-text offset map.
        function prepareReadingText(raw, withOffsets = false) {
            let text = raw;
            let offsets = withOffsets ? Array.from({length: raw.length}, (_, i) => i) : null;
            const rules = [
                [/^={3,}\s*$/gm, ""], [/^-{3,}\s*$/gm, ""],
                [/^_{3,}\s*$/gm, ""], [/^\*{3,}\s*$/gm, ""],
                [/^~{3,}\s*$/gm, ""], [/^#{1,6}\s+/gm, ""],
                [/\*\*/g, ""], [/__/g, ""], [/\x60/g, ""],
                [/^>\s?/gm, ""], [/^\s*[-*+]\s+/gm, ""],
                [/\n{3,}/g, "\n\n"]
            ];
            for (const [pattern, replacement] of rules) {
                if (offsets) {
                    const next = [];
                    let cursor = 0;
                    for (const match of text.matchAll(pattern)) {
                        for (let i = cursor; i < match.index; i++) next.push(offsets[i]);
                        for (let i = 0; i < replacement.length; i++) next.push(offsets[match.index + i]);
                        cursor = match.index + match[0].length;
                    }
                    for (let i = cursor; i < text.length; i++) next.push(offsets[i]);
                    offsets = next;
                }
                text = text.replace(pattern, replacement);
            }
            const leading = text.length - text.trimStart().length;
            text = text.trim();
            return {text, offsets: offsets ? offsets.slice(leading, leading + text.length) : null};
        }

        function cleanText(text) {
            return prepareReadingText(text).text;
        }

        function readChunkEnds(raw, chunks) {
            const prepared = prepareReadingText(raw, true);
            let cursor = 0;
            const ends = [];
            for (const chunk of chunks) {
                let end = 0;
                for (let i = 0; i < chunk.length; i++) {
                    if (/\s/.test(chunk[i])) continue;
                    while (cursor < prepared.text.length && /\s/.test(prepared.text[cursor])) cursor++;
                    if (prepared.text[cursor] !== chunk[i]) return [];
                    end = prepared.offsets[cursor++] + 1;
                }
                ends.push(end);
            }
            return ends;
        }

        const readView = document.getElementById("readView");
        const readCompleted = document.getElementById("readCompleted");
        const readCurrent = document.getElementById("readCurrent");
        const readRemaining = document.getElementById("readRemaining");
        let readingViewState = null;

        function beginReadingView(raw, chunks, session) {
            readView.style.height = getComputedStyle(promptText).height;
            readingViewState = {raw, ends: readChunkEnds(raw, chunks), session, chunk: -1};
            readCompleted.textContent = "";
            readCurrent.textContent = "";
            readRemaining.textContent = raw;
            promptText.hidden = true;
            readView.hidden = false;
            readView.scrollTop = 0;
        }

        function markReadingChunk(index, session) {
            const state = readingViewState;
            if (!state || state.session !== session || session !== playbackSession ||
                !isActive || isPaused || index <= state.chunk || index >= state.ends.length) return;
            const start = index > 0 ? state.ends[index - 1] : 0;
            const end = state.ends[index];
            state.chunk = index;
            readCompleted.textContent = state.raw.slice(0, start);
            readCurrent.textContent = state.raw.slice(start, end);
            readRemaining.textContent = state.raw.slice(end);
            // Follow chunk boundaries inside the text area; never move the page.
            const top = readCurrent.offsetTop;
            if (top < readView.scrollTop || top > readView.scrollTop + readView.clientHeight - 24) {
                readView.scrollTop = Math.max(0, top - 12);
            }
        }

        function endReadingView(session = playbackSession) {
            if (readingViewState && readingViewState.session !== session) return;
            readingViewState = null;
            readView.hidden = true;
            promptText.hidden = false;
        }


        // ==================================================
        // SPLIT TEXT INTO CHUNKS
        // ==================================================

        function splitIntoChunks(text) {

            const segmenter =
                new Intl.Segmenter(
                    "en",
                    {
                        granularity: "sentence"
                    }
                );


            const sentences =
                Array.from(
                    segmenter.segment(text),

                    part =>
                        part.segment.trim()
                )
                .filter(Boolean);


            const chunks = [];

            let currentChunkText = "";

            const firstChunkLength = 150;
            const secondChunkLength = 300;
            const normalChunkLength = 700;


            const boundedSentences = sentences.flatMap(sentence => {
                const parts = [];
                while (sentence.length > 3000) {
                    let boundary = sentence.lastIndexOf(" ", 3000);
                    if (boundary < 1) boundary = 3000;
                    // Do not split a UTF-16 surrogate pair.
                    if (/[\uD800-\uDBFF]/.test(sentence[boundary - 1])) boundary--;
                    parts.push(sentence.slice(0, boundary));
                    sentence = sentence.slice(boundary).trimStart();
                }
                if (sentence) parts.push(sentence);
                return parts;
            });
            for (const sentence of boundedSentences) {

                let targetLength;

                if (chunks.length === 0) {

                    targetLength =
                        firstChunkLength;

                } else if (chunks.length === 1) {

                    targetLength =
                        secondChunkLength;

                } else {

                    targetLength =
                        normalChunkLength;
                }


                const candidate =
                    currentChunkText
                        ? currentChunkText + " " + sentence
                        : sentence;


                if (
                    candidate.length <=
                    targetLength
                ) {

                    currentChunkText =
                        candidate;

                } else {

                    if (currentChunkText) {

                        chunks.push(
                            currentChunkText
                        );
                    }


                    currentChunkText =
                        sentence;
                }
            }


            if (currentChunkText) {

                chunks.push(
                    currentChunkText
                );
            }


            return chunks;
        }


        // ==================================================
        // AUDIO CLEANUP
        // ==================================================

        function cleanUpQwenAudio() {

            // Stop both the audible source and the one scheduled ahead.
            for (const source of qwenScheduledSources) {
                source.onended = null;
                try {
                    source.stop();
                } catch {
                }
            }
            qwenScheduledSources = [];
            qwenCurrentSource = null;
            qwenNextStartTime = 0;

            qwenAudioQueue = [];

            qwenGenerationComplete = false;


            if (qwenAudioContext) {

                const contextToClose =
                    qwenAudioContext;

                qwenAudioContext = null;
                qwenGainNode = null;

                contextToClose.close().catch(
                    function () {
                    }
                );
            }
        }


        function cleanUpAudio() {

            if (currentAudio) {

                currentAudio.pause();

                currentAudio.onended = null;
                currentAudio.onplaying = null;

                currentAudio.onerror = null;

                currentAudio = null;
            }


            if (currentAudioUrl) {

                URL.revokeObjectURL(
                    currentAudioUrl
                );

                currentAudioUrl = null;
            }


            cleanUpQwenAudio();
        }


        // ==================================================
        // CANCEL ALL TTS REQUESTS
        // ==================================================

        function cancelAllRequests() {

            for (
                const controller
                of fetchControllers.values()
            ) {

                controller.abort();
            }


            fetchControllers.clear();

            chunkAudioCache.clear();
        }


        // ==================================================
        // APPLY VOLUME + SPEED
        // ==================================================

        function applyAudioSettings() {

            const volume =
                Number(
                    volumeSlider.value
                );

            const speed =
                Number(
                    speedSlider.value
                );


            if (currentAudio) {

                currentAudio.volume =
                    volume;

                currentAudio.playbackRate =
                    speed;

                if (
                    "preservesPitch"
                    in currentAudio
                ) {

                    currentAudio.preservesPitch =
                        true;
                }
            }


            if (qwenGainNode) {

                qwenGainNode.gain.value =
                    volume;
            }


            // Qwen Fast uses pitch-preserving PCM
            // time stretching instead of playbackRate.
        }


        // ==================================================
        // REQUEST TTS AUDIO
        // ==================================================

        async function fetchChunkAudio(
            chunkIndex,
            session
        ) {

            if (
                chunkIndex >=
                speechChunks.length
            ) {

                return null;
            }


            if (
                chunkAudioCache.has(
                    chunkIndex
                )
            ) {

                return chunkAudioCache.get(
                    chunkIndex
                );
            }


            const requestPromise =
                (async function () {

                    const controller =
                        new AbortController();


                    fetchControllers.set(
                        chunkIndex,
                        controller
                    );


                    try {

                        const response =
                            await fetch(
                                "/tts",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            text:
                                                speechChunks[
                                                    chunkIndex
                                                ],

                                            engine:
                                                activeEngine,

                                            voice:
                                                activeVoice,

                                            compute:
                                                activeCompute
                                        }),

                                    signal:
                                        controller.signal
                                }
                            );


                        if (!response.ok) {

                            let message =
                                "TTS generation failed.";


                            try {

                                const errorData =
                                    await response.json();


                                if (
                                    errorData.error
                                ) {

                                    message =
                                        errorData.error;
                                }

                            } catch {
                            }


                            throw new Error(
                                message
                            );
                        }


                        if (
                            session !==
                            playbackSession
                        ) {

                            return null;
                        }


                        return await response.blob();


                    } finally {

                        if (fetchControllers.get(chunkIndex) === controller) {
                            fetchControllers.delete(chunkIndex);
                        }
                    }

                })();


            chunkAudioCache.set(
                chunkIndex,
                requestPromise
            );


            try {

                return await requestPromise;


            } catch (error) {

                if (chunkAudioCache.get(chunkIndex) === requestPromise) {
                    chunkAudioCache.delete(chunkIndex);
                }


                throw error;
            }
        }


        // ==================================================
        // QWEN FAST STREAMING PLAYBACK
        // ==================================================

        function qwenStreamUrl() {

            const qwenInfo =
                systemInfo &&
                systemInfo.engines
                    ? systemInfo.engines.qwen
                    : null;


            return (
                qwenInfo &&
                qwenInfo.stream_url
            )
                ? qwenInfo.stream_url
                : "http://127.0.0.1:5001/stream";
        }


        function qwenHealthUrl() {

            return qwenStreamUrl().replace(
                /\/stream$/,
                "/health"
            );
        }

        function qwenCancelUrl() {

            return qwenStreamUrl().replace(
                /\/stream$/,
                "/cancel"
            );
        }


        function cancelQwenServerGeneration() {
            const requestId = activeQwenRequestId;
            if (!requestId) return;
            activeQwenRequestId = null;
            fetch(
                qwenCancelUrl(),
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({request_id: requestId}),

                    keepalive: true
                }
            )
            .catch(function () {
                // Best effort. A new Qwen stream also
                // cancels any older server-side generation.
            });
        }



        function delay(milliseconds) {

            return new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        milliseconds
                    )
            );
        }


        function prepareQwenAudioContext() {

            if (!qwenAudioContext) {

                const AudioContextClass =
                    window.AudioContext ||
                    window.webkitAudioContext;


                qwenAudioContext =
                    new AudioContextClass();


                qwenGainNode =
                    qwenAudioContext.createGain();


                qwenGainNode.connect(
                    qwenAudioContext.destination
                );


                applyAudioSettings();
            }


            if (
                !isPaused &&
                qwenAudioContext.state ===
                    "suspended"
            ) {

                qwenAudioContext.resume().catch(
                    function () {
                    }
                );
            }
        }


        async function waitForQwenReady(session) {
            const deadline = Date.now() + 120000;
            while (Date.now() < deadline) {
                if (session !== playbackSession) {
                    throw new DOMException("Playback cancelled", "AbortError");
                }
                const controller = new AbortController();
                const key = "qwen-health-" + session;
                fetchControllers.set(key, controller);
                const timer = setTimeout(() => controller.abort(), 2000);
                let info = null;
                try {
                    const response = await fetch(qwenHealthUrl(), {
                        cache: "no-store", signal: controller.signal
                    });
                    if (response.ok) info = await response.json();
                } catch {
                    // Transport errors and per-poll timeouts can recover during startup.
                } finally {
                    clearTimeout(timer);
                    if (fetchControllers.get(key) === controller) fetchControllers.delete(key);
                }
                if (session !== playbackSession) {
                    throw new DOMException("Playback cancelled", "AbortError");
                }
                if (info && info.status === "ready") return info;
                if (info && info.status === "error") {
                    throw new Error("Qwen fast engine failed to start. Check the local sidecar console.");
                }
                statusDisplay.textContent = info
                    ? "Warming Qwen3-TTS on NVIDIA GPU..."
                    : "Starting Qwen fast engine...";
                await delay(250);
            }
            throw new Error("Qwen fast engine did not become ready in time.");
        }


        function finishQwenIfDone(
            session
        ) {

            if (
                session !==
                playbackSession
            ) {

                return;
            }


            if (
                !qwenGenerationComplete ||
                qwenCurrentSource ||
                qwenAudioQueue.length > 0
            ) {

                return;
            }


            isActive = false;
            isPaused = false;

            pauseButton.textContent =
                "Pause";

            endReadingView(session);
            statusDisplay.textContent =
                "Finished";
        }


        // ==================================================
        // QWEN PITCH-PRESERVING SPEED
        // ==================================================

        function stretchQwenPcmPreservePitch(
            samples,
            speed
        ) {

            if (
                !samples ||
                samples.length < 2048 ||
                Math.abs(speed - 1) < 0.01
            ) {

                return samples;
            }


            // Lightweight WSOLA-style time stretching.
            // Frames are moved closer together or farther apart
            // without resampling them, so pitch stays stable.
            const frameSize = 1024;
            const overlap = 512;
            const synthesisHop =
                frameSize - overlap;

            const analysisHop =
                synthesisHop * speed;

            const searchRadius = 96;
            const searchStep = 4;

            const targetLength =
                Math.max(
                    1,
                    Math.round(
                        samples.length / speed
                    )
                );

            const output =
                new Float32Array(
                    targetLength +
                    frameSize +
                    overlap
                );


            const firstLength =
                Math.min(
                    frameSize,
                    samples.length
                );

            output.set(
                samples.subarray(
                    0,
                    firstLength
                ),
                0
            );


            let written =
                firstLength;

            let outputPos =
                synthesisHop;

            let expectedInputPos =
                analysisHop;

            const maxCandidate =
                Math.max(
                    0,
                    samples.length -
                    frameSize
                );


            const finalStart = Math.max(0, targetLength - frameSize);
            while (
                outputPos < finalStart &&
                expectedInputPos <
                    samples.length - overlap
            ) {

                const expected =
                    Math.max(
                        0,
                        Math.min(
                            maxCandidate,
                            Math.round(
                                expectedInputPos
                            )
                        )
                    );


                let bestCandidate =
                    expected;


                const searchStart =
                    Math.max(
                        0,
                        expected -
                        searchRadius
                    );

                const searchEnd =
                    Math.min(
                        maxCandidate,
                        expected +
                        searchRadius
                    );


                const availableOverlap =
                    Math.min(
                        overlap,
                        Math.max(
                            0,
                            written -
                            outputPos
                        )
                    );


                if (
                    availableOverlap >= 128
                ) {

                    let outputEnergy = 0;


                    for (
                        let i = 0;
                        i < availableOverlap;
                        i += 4
                    ) {

                        const value =
                            output[
                                outputPos + i
                            ];

                        outputEnergy +=
                            value * value;
                    }


                    let bestScore =
                        -Infinity;


                    for (
                        let candidate =
                            searchStart;
                        candidate <=
                            searchEnd;
                        candidate +=
                            searchStep
                    ) {

                        let dot = 0;
                        let inputEnergy = 0;


                        for (
                            let i = 0;
                            i <
                                availableOverlap;
                            i += 4
                        ) {

                            const outValue =
                                output[
                                    outputPos + i
                                ];

                            const inValue =
                                samples[
                                    candidate + i
                                ];

                            dot +=
                                outValue *
                                inValue;

                            inputEnergy +=
                                inValue *
                                inValue;
                        }


                        const denominator =
                            Math.sqrt(
                                outputEnergy *
                                inputEnergy
                            ) + 1e-12;

                        const score =
                            dot /
                            denominator;


                        if (
                            score >
                            bestScore
                        ) {

                            bestScore =
                                score;

                            bestCandidate =
                                candidate;
                        }
                    }
                }


                const availableFrame =
                    Math.min(
                        frameSize,
                        samples.length -
                            bestCandidate,
                        output.length -
                            outputPos
                    );


                const actualOverlap =
                    Math.min(
                        overlap,
                        availableFrame,
                        Math.max(
                            0,
                            written -
                            outputPos
                        )
                    );


                // Cosine crossfade between the existing tail
                // and the newly aligned frame.
                for (
                    let i = 0;
                    i < actualOverlap;
                    i++
                ) {

                    const t =
                        (i + 1) /
                        (actualOverlap + 1);

                    const newWeight =
                        0.5 -
                        0.5 *
                        Math.cos(
                            Math.PI * t
                        );

                    const oldWeight =
                        1 - newWeight;

                    output[
                        outputPos + i
                    ] =
                        (
                            output[
                                outputPos + i
                            ] *
                            oldWeight
                        ) +
                        (
                            samples[
                                bestCandidate + i
                            ] *
                            newWeight
                        );
                }


                for (
                    let i =
                        actualOverlap;
                    i <
                        availableFrame;
                    i++
                ) {

                    output[
                        outputPos + i
                    ] =
                        samples[
                            bestCandidate + i
                        ];
                }


                written =
                    Math.max(
                        written,
                        outputPos +
                            availableFrame
                    );


                outputPos +=
                    synthesisHop;

                expectedInputPos +=
                    analysisHop;
            }


            // Anchor the final frame to the real input tail. Truncating a regular
            // WSOLA frame here discards tail samples and creates a phase jump
            // when the next independently processed PCM frame starts.
            const tailLength = targetLength - finalStart;
            const inputTail = samples.length - tailLength;
            const crossfade = Math.min(overlap, tailLength, Math.max(0, written - finalStart));
            for (let i = 0; i < tailLength; i++) {
                const weight = i < crossfade && crossfade > 1
                    ? 0.5 - 0.5 * Math.cos(Math.PI * i / (crossfade - 1))
                    : 1;
                output[finalStart + i] =
                    output[finalStart + i] * (1 - weight) + samples[inputTail + i] * weight;
            }
            return output.slice(0, targetLength);
        }


        function showQwenSourceProgress(source, session) {
            const chunkIndex = source.voxTextChunkIndex;
            let detail = "";
            if (!qwenFirstAudioStarted) {
                qwenFirstAudioStarted = true;
                const ttfa = (performance.now() - qwenReadStartedAt) / 1000;
                detail = " - TTFA " + ttfa.toFixed(2) + "s";
            }
            statusDisplay.textContent =
                "Reading " + (chunkIndex + 1) + " / " + speechChunks.length +
                " - " + activeVoiceLabel + " - Qwen Fast" + detail;
            markReadingChunk(chunkIndex, session);
        }


        function playNextQwenBuffer(session) {
            if (session !== playbackSession || isPaused) return;

            // Keep only one buffer ahead. Its start is set on the audio clock,
            // rather than waiting for an ended event to process the next frame.
            // Speed edits take effect as the next unscheduled frame is prepared.
            while (qwenAudioQueue.length && qwenScheduledSources.length < 2) {
                prepareQwenAudioContext();
                const item = qwenAudioQueue.shift();
                const playbackSamples = stretchQwenPcmPreservePitch(
                    item.samples, Number(speedSlider.value)
                );
                const audioBuffer = qwenAudioContext.createBuffer(
                    1, playbackSamples.length, item.sampleRate
                );
                audioBuffer.copyToChannel(playbackSamples, 0);
                const source = qwenAudioContext.createBufferSource();
                source.buffer = audioBuffer;
                source.playbackRate.value = 1;
                source.voxTextChunkIndex = item.textChunkIndex;
                source.connect(qwenGainNode);

                source.onended = function () {
                    if (session !== playbackSession) return;
                    const index = qwenScheduledSources.indexOf(source);
                    if (index < 0) return;
                    qwenScheduledSources.splice(index, 1);
                    qwenCurrentSource = qwenScheduledSources[0] || null;
                    if (index === 0 && qwenCurrentSource) {
                        showQwenSourceProgress(qwenCurrentSource, session);
                    }
                    playNextQwenBuffer(session);
                };

                const startTime = Math.max(qwenAudioContext.currentTime, qwenNextStartTime);
                qwenNextStartTime = startTime + playbackSamples.length / item.sampleRate;
                qwenScheduledSources.push(source);
                qwenCurrentSource = qwenScheduledSources[0];
                source.start(startTime);
                if (qwenCurrentSource === source) {
                    showQwenSourceProgress(source, session);
                }
            }
            finishQwenIfDone(session);
        }


        function enqueueQwenPcm(
            samples,
            sampleRate,
            textChunkIndex,
            session
        ) {

            if (
                session !==
                playbackSession
            ) {

                return;
            }


            qwenAudioQueue.push({
                samples:
                    samples,

                sampleRate:
                    sampleRate,

                textChunkIndex:
                    textChunkIndex
            });


            playNextQwenBuffer(
                session
            );
        }


        async function streamQwenTextChunk(
            textChunkIndex,
            session
        ) {

            const controller =
                new AbortController();


            const controllerKey =
                "qwen-" +
                textChunkIndex;
            const requestId = qwenClientId + ":" + session + ":" + textChunkIndex;
            activeQwenRequestId = requestId;
            let reader = null;


            fetchControllers.set(
                controllerKey,
                controller
            );


            try {

                const response =
                    await fetch(
                        qwenStreamUrl(),
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    text:
                                        speechChunks[
                                            textChunkIndex
                                        ],

                                    speaker:
                                        activeVoice,

                                    language:
                                        "English",

                                    chunk_size:
                                        qwenStreamChunkSize,

                                    request_id:
                                        requestId
                                }),

                            signal:
                                controller.signal
                        }
                    );


                if (!response.ok) {

                    let message =
                        "Qwen streaming generation failed.";


                    try {

                        const errorData =
                            await response.json();


                        if (errorData.detail) {
                            message =
                                errorData.detail;
                        }

                    } catch {
                    }


                    throw new Error(
                        message
                    );
                }


                if (!response.body) {

                    throw new Error(
                        "Browser streaming response is unavailable."
                    );
                }


                reader = response.body.getReader();
                const parser = new VoxPcmParser();
                while (true) {
                    const result = await reader.read();
                    if (session !== playbackSession) {
                        controller.abort();
                        return;
                    }
                    if (result.done) {
                        parser.finish();
                        return;
                    }
                    for (const frame of parser.push(result.value)) {
                        enqueueQwenPcm(frame.samples, frame.sampleRate, textChunkIndex, session);
                    }
                    if (parser.ended) return;
                }

            } finally {

                if (reader) {
                    try { await reader.cancel(); } catch {}
                    reader.releaseLock();
                }
                if (fetchControllers.get(controllerKey) === controller) {
                    fetchControllers.delete(controllerKey);
                }
                if (activeQwenRequestId === requestId) activeQwenRequestId = null;
            }
        }


        async function playQwenSession(
            session
        ) {

            try {

                await waitForQwenReady(
                    session
                );


                for (
                    let index = 0;
                    index < speechChunks.length;
                    index++
                ) {

                    if (
                        session !==
                        playbackSession
                    ) {

                        return;
                    }


                    currentChunk =
                        index;


                    if (
                        !qwenCurrentSource &&
                        qwenAudioQueue.length === 0
                    ) {

                        statusDisplay.textContent =
                            "Preparing " +
                            (index + 1) +
                            " / " +
                            speechChunks.length +
                            " - Qwen Fast";
                    }


                    await streamQwenTextChunk(
                        index,
                        session
                    );
                }


                if (
                    session !==
                    playbackSession
                ) {

                    return;
                }


                qwenGenerationComplete =
                    true;


                finishQwenIfDone(
                    session
                );

            } catch (error) {
                if (session !== playbackSession) return;

                if (
                    error.name ===
                    "AbortError"
                ) {

                    return;
                }


                console.error(
                    "Qwen Fast error:",
                    error
                );


                statusDisplay.textContent =
                    "Error: " +
                    error.message;


                isActive = false;
                endReadingView(session);

                cancelAllRequests();
                cleanUpQwenAudio();
            }
        }


        // ==================================================
        // PRE-GENERATE NEXT CHUNK
        // ==================================================

        function prefetchNextChunk(
            session
        ) {

            const nextChunk =
                currentChunk + 1;


            if (
                nextChunk >=
                speechChunks.length
            ) {

                return;
            }


            if (
                session !==
                playbackSession
            ) {

                return;
            }


            fetchChunkAudio(
                nextChunk,
                session
            )
            .catch(function (error) {

                if (
                    error.name !==
                    "AbortError"
                ) {

                    console.error(
                        "Prefetch error:",
                        error
                    );
                }
            });
        }


        // ==================================================
        // PLAY CURRENT CHUNK
        // ==================================================

        async function playCurrentChunk(
            session
        ) {

            if (
                session !==
                playbackSession
            ) {

                return;
            }


            if (
                currentChunk >=
                speechChunks.length
            ) {

                cleanUpAudio();


                isActive = false;

                isPaused = false;


                pauseButton.textContent =
                    "Pause";


                endReadingView(session);
                statusDisplay.textContent =
                    "Finished";


                return;
            }


            statusDisplay.textContent =
                "Preparing " +
                (currentChunk + 1) +
                " / " +
                speechChunks.length;


            try {

                const audioBlob =
                    await fetchChunkAudio(
                        currentChunk,
                        session
                    );


                if (
                    !audioBlob ||
                    session !==
                    playbackSession
                ) {

                    return;
                }


                chunkAudioCache.delete(
                    currentChunk
                );


                cleanUpAudio();


                currentAudioUrl =
                    URL.createObjectURL(
                        audioBlob
                    );


                currentAudio =
                    new Audio(
                        currentAudioUrl
                    );


                applyAudioSettings();


                currentAudio.onplaying = function () {
                    markReadingChunk(currentChunk, session);
                };
                currentAudio.onended =
                    function () {

                        if (
                            session !==
                            playbackSession
                        ) {

                            return;
                        }


                        cleanUpAudio();


                        currentChunk++;


                        playCurrentChunk(
                            session
                        );
                    };


                currentAudio.onerror =
                    function () {

                        statusDisplay.textContent =
                            "Audio playback error.";


                        isActive = false;
                        endReadingView(session);
                    };


                if (isPaused) {

                    statusDisplay.textContent =
                        "Paused at " +
                        (currentChunk + 1) +
                        " / " +
                        speechChunks.length;


                    return;
                }


                statusDisplay.textContent =
                    "Reading " +
                    (currentChunk + 1) +
                    " / " +
                    speechChunks.length +
                    " - " +
                    activeEngineLabel +
                    " - " +
                    activeVoiceLabel +
                    " - " +
                    resolvedComputeLabel(
                        activeCompute,
                        activeEngine
                    );


                await currentAudio.play();


                prefetchNextChunk(
                    session
                );


            } catch (error) {
                if (session !== playbackSession) return;

                if (
                    error.name ===
                    "AbortError"
                ) {

                    return;
                }


                console.error(
                    "VOX-9K error:",
                    error
                );


                statusDisplay.textContent =
                    "Error: " +
                    error.message;


                isActive = false;
                endReadingView(session);
            }
        }


        // ==================================================
        // READ
        // ==================================================

        readButton.addEventListener(
            "click",
            function () {

                if (activeEngine === "qwen") cancelQwenServerGeneration();
                isActive = false;
                isPaused = false;
                pauseButton.textContent = "Pause";

                endReadingView();
                playbackSession++;


                cancelAllRequests();


                cleanUpAudio();


                const rawText =
                    promptText.value;


                const cleanedText =
                    cleanText(
                        rawText
                    );


                speechChunks =
                    splitIntoChunks(
                        cleanedText
                    );


                if (
                    speechChunks.length === 0
                ) {

                    statusDisplay.textContent =
                        "Nothing to read";


                    return;
                }


                // Lock in the selected engine, voice,
                // and compute mode for the entire
                // Read session.
                activeEngine =
                    engineSelect.value;

                activeEngineLabel =
                    engineSelect.options[
                        engineSelect.selectedIndex
                    ].text;

                activeVoice =
                    voiceSelect.value;

                activeVoiceLabel =
                    voiceSelect.options[
                        voiceSelect.selectedIndex
                    ].text;

                activeCompute =
                    computeSelect.value;


                currentChunk = 0;

                isPaused = false;

                isActive = true;


                pauseButton.textContent =
                    "Pause";


                const session =
                    playbackSession;

                beginReadingView(rawText, speechChunks, session);


                if (
                    activeEngine ===
                    "qwen"
                ) {

                    qwenGenerationComplete =
                        false;

                    qwenReadStartedAt =
                        performance.now();

                    qwenFirstAudioStarted =
                        false;

                    // Create/resume the Web Audio context while
                    // we are still inside the user's Read click.
                    prepareQwenAudioContext();

                    playQwenSession(
                        session
                    );

                } else {

                    playCurrentChunk(
                        session
                    );
                }
            }
        );


        // ==================================================
        // PAUSE / RESUME
        // ==================================================

        pauseButton.addEventListener(
            "click",
            async function () {
                const session = playbackSession;

                if (!isActive) {
                    return;
                }


                if (
                    activeEngine ===
                    "qwen"
                ) {

                    if (isPaused) {

                        isPaused = false;

                        pauseButton.textContent =
                            "Pause";

                        if (qwenAudioContext) {
                            await qwenAudioContext.resume();
                            if (session !== playbackSession) return;
                        }

                        playNextQwenBuffer(
                            playbackSession
                        );

                        statusDisplay.textContent =
                            "Reading - Qwen Fast";

                    } else {

                        isPaused = true;

                        pauseButton.textContent =
                            "Resume";

                        if (qwenAudioContext) {
                            await qwenAudioContext.suspend();
                            if (session !== playbackSession) return;
                        }

                        statusDisplay.textContent =
                            "Paused";
                    }

                    return;
                }


                if (isPaused) {

                    isPaused = false;


                    pauseButton.textContent =
                        "Pause";


                    if (currentAudio) {

                        applyAudioSettings();


                        statusDisplay.textContent =
                            "Reading " +
                            (currentChunk + 1) +
                            " / " +
                            speechChunks.length;


                        try {

                            await currentAudio.play();
                            if (session !== playbackSession) return;

                        } catch (error) {

                            console.error(
                                error
                            );
                        }


                        prefetchNextChunk(
                            playbackSession
                        );


                    } else {

                        playCurrentChunk(
                            playbackSession
                        );
                    }


                    return;
                }


                isPaused = true;


                if (currentAudio) {

                    currentAudio.pause();
                }


                pauseButton.textContent =
                    "Resume";


                statusDisplay.textContent =
                    "Paused at " +
                    (currentChunk + 1) +
                    " / " +
                    speechChunks.length;
            }
        );


        // ==================================================
        // STOP
        // ==================================================

        stopButton.addEventListener(
            "click",
            function () {

                if (
                    activeEngine === "qwen"
                ) {

                    cancelQwenServerGeneration();
                }


                endReadingView();
                playbackSession++;


                cancelAllRequests();


                cleanUpAudio();


                speechChunks = [];

                currentChunk = 0;

                isPaused = false;

                isActive = false;


                pauseButton.textContent =
                    "Pause";


                statusDisplay.textContent =
                    "Stopped";
            }
        );


        // ==================================================
        // COMPUTE AVAILABILITY
        // ==================================================

        async function loadSystemInfo() {

            try {

                const response =
                    await fetch(
                        "/system-info"
                    );


                if (!response.ok) {

                    throw new Error(
                        "Could not read system info."
                    );
                }


                systemInfo =
                    await response.json();


                const qwenInfo =
                    systemInfo.engines
                        ? systemInfo.engines.qwen
                        : null;


                const qwenOption =
                    engineSelect.querySelector(
                        'option[value="qwen"]'
                    );


                if (
                    qwenOption &&
                    qwenInfo &&
                    !qwenInfo.installed
                ) {

                    qwenOption.disabled =
                        true;

                    qwenOption.textContent =
                        "Qwen3-TTS 0.6B (Not installed)";
                }


                updateComputeAvailability();


            } catch (error) {

                console.error(
                    "System info error:",
                    error
                );


                computeInfo.textContent =
                    "Hardware check failed";


                cudaOption.disabled =
                    true;
            }
        }


        function updateComputeDisplay() {

            const selected =
                computeSelect.value;


            if (selected === "auto") {

                computeInfo.textContent =
                    "Auto → " +
                    resolvedComputeLabel(
                        "auto"
                    );

                return;
            }


            computeInfo.textContent =
                resolvedComputeLabel(
                    selected
                );
        }


        window.addEventListener("pagehide", () => {
            cancelQwenServerGeneration();
            cancelAllRequests();
        });
        populateVoiceOptions();

        loadSystemInfo();


        engineSelect.addEventListener(
            "change",
            updateEngineUI
        );


        computeSelect.addEventListener(
            "change",
            updateComputeDisplay
        );


        // ==================================================
        // SPEED
        // ==================================================

        speedSlider.addEventListener(
            "input",
            function () {

                speedValue.textContent =
                    Number(
                        speedSlider.value
                    ).toFixed(1)
                    + "x";


                if (currentAudio) {

                    currentAudio.playbackRate =
                        Number(
                            speedSlider.value
                        );
                }


                // Qwen Fast applies the new speed to
                // the next streamed PCM buffer while
                // preserving voice pitch.
            }
        );


        // ==================================================
        // VOLUME
        // ==================================================

        volumeSlider.addEventListener(
            "input",
            function () {

                volumeValue.textContent =
                    Math.round(
                        volumeSlider.value *
                        100
                    )
                    + "%";


                if (currentAudio) {

                    currentAudio.volume =
                        Number(
                            volumeSlider.value
                        );
                }


                if (qwenGainNode) {

                    qwenGainNode.gain.value =
                        Number(
                            volumeSlider.value
                        );
                }
            }
        );

    </script>

    <script src="/features.js"></script>
</body>

</html>
